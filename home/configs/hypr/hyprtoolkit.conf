# ~/.config/hypr/hyprtoolkit.conf

# Global typography
font_family = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font
font_size = 11
small_font_size = 10

# Rounding (logical pixels)
rounding_large = 12
rounding_small = 6

# Color palette (supports rgba(...) or hex 0xRRGGBBAA)
background = 0xFF1a1b26
base = 0xFF24283b
accent = 0xFF7aa2f7
text = 0xFFc0caf5
text_muted = 0xFF565f89
error = 0xFFf7768e
