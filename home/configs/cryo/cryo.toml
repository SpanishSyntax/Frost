  "ss_ports",
  "ping",
  "tailscale_status",
  "dns_lookup",
  "flaker_list",
  "flaker_info",
  "folio_build",
  "borealis_status",
  "code_format",
  "code_lint",
  "code_check",
  "dev_env",
