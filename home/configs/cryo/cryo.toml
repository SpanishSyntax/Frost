  "head",
  "tail",
  "find",
  "grep",
  "stat",
  "tree",
  "jq",
  "checksum",
  "detect_type",
  "wc",
  "du",
  "realpath",
  "git_status",
  "git_log",
  "git_diff",
  "git_branch",
  "git_show",
  "git_stash",
  "git_remote",
  "git_blame",
  "gh_pr",
  "gh_issue",
  "uname",
  "uptime",
  "ps",
  "df",
  "free",
  "which",
  "lsblk",
  "zoxide_query",
  "notify",
  "whoami",
  "docker_ps",
  "docker_logs",
  "docker_inspect",
  "docker_stats",
  "docker_images",
  "docker_volumes",
  "docker_networks",
  "systemctl_list",
  "systemctl_status",
  "journalctl",
  "systemd_analyze",
